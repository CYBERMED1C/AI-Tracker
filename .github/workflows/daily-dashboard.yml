name: Refresh AI security dashboard

on:
  schedule:
    # 10:00 Pacific is 17:00 UTC during PDT and 18:00 UTC during PST.
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-security-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce 10 a.m. Pacific schedule
        id: pacific_time
        shell: bash
        run: |
          offset="$(TZ=America/Los_Angeles date +%z)"
          scheduled="${{ github.event.schedule }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || \
                ( "$offset" == "-0700" && "$scheduled" == "0 17 * * *" ) || \
                ( "$offset" == "-0800" && "$scheduled" == "0 18 * * *" ) ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.pacific_time.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Refresh dashboard
        if: steps.pacific_time.outputs.run == 'true'
        env:
          TZ: America/Los_Angeles
        run: python src/update_dashboard.py

      - name: Commit daily snapshot
        if: steps.pacific_time.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/dashboard.json
          if git diff --cached --quiet; then
            echo "Dashboard is already current."
          else
            git commit -m "chore: refresh AI security dashboard $(TZ=America/Los_Angeles date +%F)"
            git push
          fi
